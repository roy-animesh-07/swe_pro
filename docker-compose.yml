# One-command local/production stack: MongoDB + JIS (API and UI on one port).
#   docker compose up -d --build     -> http://localhost:8080
#   docker compose exec app npm run seed:demo   (optional demo data)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:5000"
    environment:
      MONGO_URL: mongodb://mongo:27017/jis
      ADMIN_USERNAME: ${ADMIN_USERNAME:-registrar}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-registrar123}
      ADMIN_NAME: ${ADMIN_NAME:-Court Registrar}
      VIEW_CHARGE: ${VIEW_CHARGE:-100}
      COURT_TIMEZONE: ${COURT_TIMEZONE:-Asia/Kolkata}
      COURT_WORKING_DAYS: ${COURT_WORKING_DAYS:-1,2,3,4,5}
      COURT_TIME_SLOTS: ${COURT_TIME_SLOTS:-10:00-11:00,11:00-12:00,12:00-13:00,14:00-15:00,15:00-16:00}
      COURT_HOLIDAYS: ${COURT_HOLIDAYS:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}

volumes:
  mongo-data:
